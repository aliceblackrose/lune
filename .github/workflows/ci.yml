name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate editor assets
        run: |
          python3 -m json.tool editors/vscode/package.json >/dev/null
          python3 -m json.tool editors/vscode/language-configuration.json >/dev/null
          python3 -m json.tool editors/vscode/syntaxes/lune.tmLanguage.json >/dev/null

      - name: Build and test
        run: make test

      - name: Language server tests
        run: |
          python3 -m py_compile editors/lsp/lune_lsp.py editors/lsp/test_lune_lsp.py
          python3 editors/lsp/test_lune_lsp.py

      - name: Verify install layout
        run: |
          make install DESTDIR="$PWD/.install-root"
          ./.install-root/usr/local/bin/lune examples/hello.lune | grep -qx 'hello, world'
          ./.install-root/usr/local/bin/lune check examples/functions.lune
          make uninstall DESTDIR="$PWD/.install-root"
          test ! -e ./.install-root/usr/local/bin/lune

      - name: Build benchmark harness
        run: make bench-build

      - name: Performance baseline
        run: make bench

      - name: Sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make clean
          make test CFLAGS='-std=c17 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer'

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            diffutils
            make
            mingw-w64-x86_64-gcc

      - name: Build and test
        shell: msys2 {0}
        run: make test

